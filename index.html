<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automobile Training Academy</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Auto Training Academy</div>
        <div class="nav-links">
            <a href="#home" class="active">Home</a>
            <a href="#dashboard">Dashboard</a>
            <a href="#blog">Blog</a>
            <a href="#contact">Contact Us</a>
            <button class="login-btn" onclick="showLoginForm()">Login</button>
            <button class="register-btn" onclick="showRegisterForm()">Register</button>
        </div>
    </nav>

    <main>
        <section id="home" class="hero">
            <h1>Welcome to Auto Training Academy</h1>
            <p>Your journey to becoming an automotive expert starts here</p>
            <button class="cta-btn" onclick="showRegisterForm()">Start Learning Today</button>
        </section>

        <div id="loginModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeLoginForm()">&times;</span>
                <h2>Login</h2>
                <form id="loginForm">
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
            </div>
        </div>

        <div id="registerModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeRegisterForm()">&times;</span>
                <h2>Register</h2>
                <form id="registerForm">
                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <input type="password" placeholder="Confirm Password" required>
                    <button type="submit">Register</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Auto Training Academy. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
