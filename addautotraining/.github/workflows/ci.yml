name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:5
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Update Browserslist DB (avoid stale warnings)
      run: npx update-browserslist-db@latest --quiet || true
    - name: Build (unified)
      run: npm run build
    - run: npm run lint
      continue-on-error: true
    - run: npm run test:all
      env:
        MONGO_URI: mongodb://localhost:27017/addautotraining_test
        JWT_SECRET: test-secret
        CI: true
